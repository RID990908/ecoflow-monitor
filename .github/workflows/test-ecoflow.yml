name: Test EcoFlow API from GitHub Actions IP
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Query EcoFlow device list
        env:
          ECOFLOW_ACCESS_KEY: ${{ secrets.ECOFLOW_ACCESS_KEY }}
          ECOFLOW_SECRET_KEY: ${{ secrets.ECOFLOW_SECRET_KEY }}
        run: |
          python3 -c "
          import hashlib, hmac, random, time, os, requests
          ACCESS_KEY = os.environ['ECOFLOW_ACCESS_KEY']
          SECRET_KEY = os.environ['ECOFLOW_SECRET_KEY']
          nonce = str(random.randint(100000, 999999))
          timestamp = str(int(time.time() * 1000))
          sign_str = f'accessKey={ACCESS_KEY}&nonce={nonce}&timestamp={timestamp}'
          sig = hmac.new(SECRET_KEY.encode(), sign_str.encode(), hashlib.sha256).hexdigest()
          headers = {'accessKey': ACCESS_KEY, 'nonce': nonce, 'timestamp': timestamp, 'sign': sig}
          my_ip = requests.get('https://api.ipify.org', timeout=10).text
          print('Outbound IP:', my_ip)
          r = requests.get('https://api.ecoflow.com/iot-open/sign/device/list', headers=headers, timeout=15)
          print(r.status_code, r.text)
          "
