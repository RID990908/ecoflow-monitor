name: EcoFlow Worker

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar"
        required: true
        type: choice
        options:
          - report
          - estado
          - ac_check
  schedule:
    # Respaldo por si el orquestador de Railway está caído: chequea carga AC
    # cada 15 min igual, para no perder la alerta por completo.
    - cron: "*/15 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run action
        env:
          ECOFLOW_ACCESS_KEY: ${{ secrets.ECOFLOW_ACCESS_KEY }}
          ECOFLOW_SECRET_KEY: ${{ secrets.ECOFLOW_SECRET_KEY }}
          ECOFLOW_SN_DELTA2: ${{ secrets.ECOFLOW_SN_DELTA2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTION: ${{ github.event.inputs.action || 'ac_check' }}
        run: python ecoflow_telegram_monitor.py

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update bot state [skip ci]"
            for i in 1 2 3; do
              git push && break
              echo "Push rejected (concurrent run), retrying with rebase..."
              git pull --rebase origin master
            done
          fi
