function cond(c){if(c>=95)return{k:'storm',r:90,n:'Tormenta'};if(c>=80)return{k:'rain',r:c>=82?90:60,n:c>=82?'Chubascos fuertes':'Chubascos'};if(c>=61&&c<=67)return{k:'rain',r:c>=65?90:55,n:c>=65?'Lluvia fuerte':'Lluvia'};if(c>=51&&c<=57)return{k:'rain',r:25,n:'Llovizna'};if(c===45||c===48)return{k:'fog',r:0,n:'Niebla'};return{k:'none',r:0,n:null};}
function rnd(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const NS='http://www.w3.org/2000/svg';

  const rg=$('rain'),r2=rnd(5);for(let i=0;i<90;i++){const x=(r2()*410-10).toFixed(0),l=document.createElementNS(NS,'line');l.setAttribute('x1',x);l.setAttribute('y1',0);l.setAttribute('x2',x-4);l.setAttribute('y2',14);l.setAttribute('stroke','#cfe3ff');l.setAttribute('stroke-width','1.2');l.setAttribute('class','rd');l.style.animationDuration=(.6+r2()*.5).toFixed(2)+'s';l.style.animationDelay=(-r2()*1.2).toFixed(2)+'s';l.style.setProperty('--y',(r2()*300).toFixed(0)+'px');rg.appendChild(l);}
  const fg2=$('fog');[[60,150,150,16],[300,185,170,18],[190,230,200,20]].forEach((e,i)=>{const el=document.createElementNS(NS,'ellipse');el.setAttribute('cx',e[0]);el.setAttribute('cy',e[1]);el.setAttribute('rx',e[2]);el.setAttribute('ry',e[3]);el.setAttribute('opacity','.55');el.setAttribute('class','hz');el.style.animationDuration=(14+i*4)+'s';el.style.filter='blur(9px)';fg2.appendChild(el);});
  const spots=[[60,88,.7],[250,72,.8],[140,102,.6],[330,98,.6],[195,86,.9],[30,106,.55]],cg=$('clouds');
  spots.forEach((s,i)=>{const g=document.createElementNS(NS,'g');g.setAttribute('transform','translate('+s[0]+' '+s[1]+') scale('+s[2]+')');g.setAttribute('class','cgp');
    const inner=document.createElementNS(NS,'g');inner.setAttribute('class','cl');inner.style.animationDuration=(11+i*2.3)+'s';inner.style.animationDelay=(-i*3)+'s';
    [[0,0,40,14],[-22,-8,20,12],[14,-12,26,14],[34,-3,18,10]].forEach(e=>{const el=document.createElementNS(NS,'ellipse');el.setAttribute('cx',e[0]);el.setAttribute('cy',e[1]);el.setAttribute('rx',e[2]);el.setAttribute('ry',e[3]);inner.appendChild(el);});
    g.appendChild(inner);cg.appendChild(g);});}
function render(h,sr,ss,cloud,phase,live,code){
  const cd=cond(code||0),wet=cd.k==='rain'||cd.k==='storm';let cc=Math.min(1,Math.max(0,cloud/100));if(wet)cc=Math.max(cc,.9);if(cd.k==='fog')cc=Math.max(cc,.4);
  const root=document.documentElement.style,dk=(1-.18*cc)*(cd.k==='storm'?.7:1),fg=cd.k==='fog'?.5:1;
  const s=skyAt(h,keys(sr,ss));root.setProperty('--st',rgb(gray(s[0],.7*cc,dk)));root.setProperty('--sh',rgb(gray(s[1],.7*cc,dk)));{const g0=gray(s[1],.7*cc,dk),D=[8,12,20];root.setProperty('--gd',rgb(mix(g0,D,.8)));root.setProperty('--h1',rgb(mix(g0,D,.55)));root.setProperty('--h2',rgb(mix(g0,D,.72)));{const a=mix(gray(s[0],.7*cc,dk),gray(s[1],.7*cc,dk),.6),lin=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)},L=.2126*lin(a[0])+.7152*lin(a[1])+.0722*lin(a[2]);let al=(L-.06)/(L-.004);root.setProperty('--sc',Math.max(.3,Math.min(.9,al)).toFixed(2));}root.setProperty('--h0',rgb(mix(g0,D,.35)));root.setProperty('--sil',rgb(mix(g0,D,.94)));root.setProperty('--lit',(1-daylight(h,sr,ss)).toFixed(2));}
  const d=daylight(h,sr,ss),dayS=h>=sr&&h<=ss;let p,body;
  if(dayS){p=(h-sr)/(ss-sr);body='sun';}else{const N=24-ss+sr;p=h>=ss?(h-ss)/N:(h+24-ss)/N;body='moon';}
  const xy=pos(p),vis=Math.min(1,p*14,(1-p)*14),sun=$('sun'),moon=$('moon');
  if(body==='sun'){const alt=Math.sin(Math.PI*p),c=mix(hex('#ff8a3c'),hex('#fff2b8'),Math.min(1,alt*1.6));
    $('halo0').setAttribute('stop-color',rgb(c));$('core').setAttribute('fill',rgb(mix(c,[255,255,255],.45)));
    sun.setAttribute('transform','translate('+xy[0].toFixed(1)+' '+xy[1].toFixed(1)+')');sun.style.opacity=(vis*(1-.65*cc)*fg).toFixed(2);sun.style.filter='blur('+(cc*2.5).toFixed(1)+'px)';moon.style.opacity=0;}
  else{$('lit').setAttribute('d',litPath(phase,12));moon.setAttribute('transform','translate('+xy[0].toFixed(1)+' '+xy[1].toFixed(1)+')');moon.style.opacity=(vis*(1-.6*cc)*fg).toFixed(2);moon.style.filter='blur('+(cc*1.5).toFixed(1)+'px)';sun.style.opacity=0;}
  const gl=$('glit');if(gl){gl.setAttribute('transform','translate('+(xy[0]-195).toFixed(1)+' 0)');gl.style.opacity=(vis*(body==='sun'?(1-.7*cc):.6*(1-.8*cc))).toFixed(2);gl.style.color=body==='sun'?'#ffe9a8':'#dfe7ff';}
  const bl=$('blob');if(bl){bl.style.transform='translate('+xy[0].toFixed(0)+'px,'+xy[1].toFixed(0)+'px)';bl.style.opacity=(vis*(1-.6*cc)).toFixed(2);bl.style.setProperty('--sunc',body==='sun'?rgb(mix(hex('#ff8a3c'),hex('#fff2b8'),Math.min(1,Math.sin(Math.PI*p)*1.6))):'rgb(190,208,255)');}
  const ep=$('elapsed');ep.setAttribute('stroke-dasharray',p.toFixed(3)+' 2');ep.setAttribute('stroke',body==='sun'?'#ffe9a8':'#dfe7ff');
  $('tl').textContent=body==='sun'?'Sale '+fmt(sr):'Luna sale '+fmt(ss);$('tr').textContent=body==='sun'?'Se pone '+fmt(ss):'Se pone '+fmt(sr);
  $('stars').style.opacity=((1-d)*(1-.85*cc)*(cd.k==='fog'?.3:1)).toFixed(2);
  const cf=rgb(mix(hex('#3a4766'),hex('#f5f8fc'),d)),n=Math.round(cc*6);
  document.querySelectorAll('#clouds .cgp').forEach((g,i)=>{g.style.display=i<n?'block':'none';g.querySelectorAll('ellipse').forEach(e=>e.setAttribute('fill',cf));g.style.opacity=(d>.1?.6+.32*cc:.45).toFixed(2);});
  const bd=$('birds');if(bd)bd.style.opacity=(wet?0:Math.max(0,d-.4)*1.6*(1-cc)).toFixed(2);
  const rn=$('rain');rn.style.opacity=wet?(.25+.35*cd.r/100).toFixed(2):0;
  document.querySelectorAll('#rain .rd').forEach((l,i)=>{l.style.display=(wet&&i<cd.r)?'block':'none';});
  const hz=mix(hex('#3a4766'),hex('#eef3f8'),d),fo=$('fog');fo.style.opacity=cd.k==='fog'?(.55+.35*d).toFixed(2):0;
  ['fg0','fg1'].forEach(i=>$(i).setAttribute('stop-color',rgb(hz)));document.querySelectorAll('#fog .hz').forEach(e=>e.setAttribute('fill',rgb(hz)));
  $('bolt').style.display=cd.k==='storm'?'block':'none';
  document.body.classList.add('nosol');
  {const nm=cd.n||cloudName(cloud),night=!dayS,k=cd.k;
   const I=c=>'<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">'+c+'</svg>';
   const SUN='<circle cx="12" cy="12" r="5" fill="#fbbf24"/><g stroke="#fbbf24" stroke-width="2" stroke-linecap="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></g>',
     MOON='<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" fill="#dfe7ff"/>',
     CLD='<path d="M7 19a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 9.5 4.5 4.5 0 0 1 17 19z" fill="#cbd5e1"/>';
   let ic;
   if(k==='storm')ic=CLD+'<path d="M12 12l-3 5h3l-1 4 4-6h-3z" fill="#fbbf24"/>';
   else if(wet)ic=CLD+'<g stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"><path d="M9 22l1-2M13 22l1-2M17 22l1-2"/></g>';
   else if(k==='fog')ic='<g stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M6 13h14M4 17h12"/></g>';
   else if(cc>=.6)ic=CLD;
   else if(cc>=.25)ic=(night?MOON:SUN)+'<g transform="translate(3 4) scale(.8)">'+CLD+'</g>';
   else ic=night?MOON:SUN;
   const w=I(ic)+'<span>'+nm+'</span>',s=I(SUN)+'<span>↑ '+fmt(sr)+' &nbsp;↓ '+fmt(ss)+'</span>';
   const a=$('skychip'),b=$('bw'),c2=$('bs');if(a)a.innerHTML=w;if(b)b.innerHTML=w;if(c2)c2.innerHTML=s;}
  const cap=$('cap');if(cap)cap.innerHTML=(live?'<b>EN VIVO</b> · ':'')+'<b>'+fmt(h)+'</b> · '+(cd.n||cloudName(cloud))+' · '+(body==='sun'?'sol':'luna '+moonName(phase));
}
function init(){build();
  if(CFG.live){const tick=()=>{const t=nowLocal(),st=sunTimes(t.y,t.m,t.d,LAT,LON,t.off);const E=window.ECOFLOW_SKY||{},c=typeof E.cloud==='number'?E.cloud:DEFAULT_CLOUD,k=typeof E.code==='number'?E.code:0;render(t.h,st[0],st[1],c,moonPhase(t.date),true,k);};tick();setInterval(tick,30000);}
  else render(CFG.h,CFG.sr,CFG.ss,CFG.cloud,moonPhase(new Date()),false,CFG.code||0);}
